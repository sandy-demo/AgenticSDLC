name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.timezone.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - { name: "Asia/Jakarta", id: jakarta }
          - { name: "America/Los_Angeles", id: los-angeles }
    env:
      TZ: ${{ matrix.timezone.name }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: Latihan S05 — timezone
        if: github.ref_name == 'demo/ci-timezone' || github.head_ref == 'demo/ci-timezone'
        run: node --test tests/labs/ci-timezone.mjs
      - name: Latihan S13 — koneksi putus
        if: (github.ref_name == 'demo/ci-econnreset' || github.head_ref == 'demo/ci-econnreset') && matrix.timezone.id == 'los-angeles'
        run: node --test tests/labs/ci-connection.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.timezone.id }}
          path: coverage/
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
